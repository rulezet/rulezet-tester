# rulezet-tester lab VM: SSH hardening (installed by provision.sh as
# /etc/ssh/sshd_config.d/10-rulezet-lab.conf). Keys only, two accounts only.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
# keys live in a root-owned folder: no account can add a key for itself
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
AllowUsers rzlab @ADMIN_USER@
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
PermitUserRC no

# Rulezet's account: one command, no tty, nothing else, whatever the key says
Match User rzlab
    ForceCommand /opt/rulezet-tester/.venv/bin/rulezet-tester lab-agent --config /etc/rulezet-tester/lab.json
    PermitTTY no
    DisableForwarding yes
