#!/usr/sbin/nft -f
# rulezet-tester lab VM firewall (filled in by provision.sh).
# In:  SSH from Rulezet (tests) and from the admin machine (maintenance). Nothing else.
# Out: only the rzfetch user (HTTPS + DNS, to import samples) and apt (security updates).
#      rzlab — the account that touches samples — has no way out at all.
flush ruleset

table inet rulezet_lab {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        ip saddr { @RULEZET_IP@, @ADMIN_IP@ } tcp dport 22 ct state new limit rate 30/minute accept
        icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 5/second accept
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif lo accept
        ct state established,related accept
        # sample import (rulezet-tester fetch-bazaar), as rzfetch only
        meta skuid @RZFETCH_UID@ udp dport 53 accept
        meta skuid @RZFETCH_UID@ tcp dport { 53, 443 } accept
        # security updates
        meta skuid { 0, @APT_UID@ } udp dport { 53, 123 } accept
        meta skuid { 0, @APT_UID@ } tcp dport { 53, 80, 443 } accept
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept
        # everything else (rzlab, the sandbox, any process a sample could start): dropped and logged
        limit rate 10/minute log prefix "rulezet-lab out denied: " level warn
    }
}
